<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Projects</title>
  <style>
    :root {
      --bg: #fff8e7;
      --ink: #1d2433;
      --main: #2b59ff;
      --main-ink: #ffffff;
      --muted: #5b6475;
      --line: #d9d2bd;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14182a;
        --ink: #f1f2f7;
        --main: #ffd23f;
        --main-ink: #14182a;
        --muted: #a3a9bd;
        --line: #2c3250;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Trebuchet MS", "Segoe UI", Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .hero {
      flex: 1 0 auto;
      display: flex;
      padding: 16px;
    }
    .play {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      background: var(--main);
      color: var(--main-ink);
      text-decoration: none;
      border-radius: 28px;
      text-align: center;
      padding: 32px;
    }
    .play:hover { filter: brightness(1.08); }
    .play:focus-visible, .others a:focus-visible {
      outline: 4px solid var(--ink);
      outline-offset: 4px;
    }
    .play .title {
      font-size: clamp(3.5rem, 16vw, 11rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.03em;
    }
    .play .sub {
      font-size: clamp(1.1rem, 3vw, 1.8rem);
      margin-top: 16px;
    }
    .others {
      flex-shrink: 0;
      padding: 8px 24px 32px;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
    }
    .others h2 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--muted);
      margin: 16px 0 8px;
    }
    .others ul {
      list-style: none;
      margin: 0;
      padding: 0;
      border-top: 1px solid var(--line);
    }
    .others li { border-bottom: 1px solid var(--line); }
    .others a {
      display: block;
      padding: 10px 4px;
      font-size: 1rem;
      color: var(--ink);
      text-decoration: none;
    }
    .others a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <main class="hero">
    <!-- Main link: change the href and text to point anywhere -->
    <a class="play" href="/mathgame/">
      <span class="title">Number Ninja</span>
      <span class="sub">Tap anywhere to play</span>
    </a>
  </main>

  <nav class="others" aria-label="Other projects">
    <h2>More projects</h2>
    <ul>
      <!-- Add a new project by copying one <li> line -->
      <li><a href="/stg-mathgame/">Staging Mathgame </a></li>
      <li><a href="/mathgame-adm/">Admin Mathgame</a></li>
      <li><a href="/stg-mathgame-adm/">Staging Admin MathGame</a></li>
    </ul>
  </nav>

</body>
</html>
